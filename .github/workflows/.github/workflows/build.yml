name: Build Sheep Boss

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Download source code
        uses: actions/checkout@v4

      - name: Extract source archive if present
        shell: bash
        run: |
          if compgen -G "*.zip" > /dev/null; then
            mkdir -p source
            for file in *.zip; do
              unzip -oq "$file" -d source
            done
          fi

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build mod
        shell: bash
        run: |
          BUILD_FILE=$(find . -type f \( \
            -name build.gradle -o \
            -name build.gradle.kts \
          \) -not -path '*/.gradle/*' | head -n 1)

          if [ -z "$BUILD_FILE" ]; then
            echo "ERROR: build.gradle not found"
            exit 1
          fi

          BUILD_DIR=$(dirname "$BUILD_FILE")
          echo "Building project in: $BUILD_DIR"

          cd "$BUILD_DIR"
          gradle build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: sheepboss-jar
          path: |
            **/build/libs/*.jar
            !**/build/libs/*-sources.jar
          if-no-files-found: error
          retention-days: 14

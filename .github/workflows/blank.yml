name: Build Sheep Boss

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Find and build mod
        shell: bash
        run: |
          BUILD_FILE=$(find . -type f \( \
            -name build.gradle -o \
            -name build.gradle.kts \
          \) -not -path '*/.gradle/*' | head -n 1)

          if [ -z "$BUILD_FILE" ]; then
            echo "ERROR: build.gradle not found"
            find . -maxdepth 4 -type f | head -100
            exit 1
          fi

          BUILD_DIR=$(dirname "$BUILD_FILE")
          cd "$BUILD_DIR"
          gradle build --no-daemon

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: sheepboss-jar
          path: "**/build/libs/*.jar"
          if-no-files-found: error
          retention-days: 14
